<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidades — ZordsBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar"></div>

  <main class="page-wrap">
    <aside class="sidebar">
      <div class="box mini-profile" id="mini-profile"></div>
      <div class="box">
        <h3>Criar comunidade</h3>
        <form id="form-create-community">
          <div class="form-group">
            <label>Nome</label>
            <input type="text" id="comm-name" required maxlength="60" placeholder="Ex: Fãs de Rock">
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="comm-desc" placeholder="Sobre o que é esta comunidade?" maxlength="300"></textarea>
          </div>
          <button type="submit" class="btn btn-small">Criar</button>
        </form>
      </div>
    </aside>

    <section class="feed">
      <!-- Lista de comunidades ou view de uma comunidade -->
      <div id="community-view">
        <div class="box">
          <h3>Minhas comunidades</h3>
          <div id="my-communities"></div>
        </div>
        <div class="box">
          <h3>Todas as comunidades</h3>
          <div id="all-communities"></div>
        </div>
      </div>

      <!-- Feed de uma comunidade (oculto até selecionar) -->
      <div id="community-feed" style="display:none">
        <div class="box">
          <div id="community-header"></div>
        </div>
        <div class="box composer" id="comm-composer">
          <h3>Publicar na comunidade</h3>
          <form id="form-comm-post">
            <textarea id="comm-post-text" placeholder="Escreva algo..." required maxlength="280"></textarea>
            <p id="comm-post-counter" class="char-counter">0 / 280 caracteres</p>
            <button type="submit" class="btn">Publicar</button>
          </form>
        </div>
        <div class="box">
          <h3 id="comm-feed-title">Publicações</h3>
          <div id="comm-posts"></div>
        </div>
      </div>
    </section>

    <aside class="rightbar">
      <div class="box">
        <h3>Membros da comunidade</h3>
        <ul class="friend-list" id="comm-members-list"><li style="color:#90949c;font-size:10px">Selecione uma comunidade.</li></ul>
      </div>
    </aside>
  </main>

  <p class="footer-note">ZordsBook · só pra nós</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/communities.js"></script>
</body>
</html>
