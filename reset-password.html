<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova senha — ZordsBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <header class="login-header">
    <div class="logo">Zords<span>Book</span></div>
  </header>

  <main class="login-container" style="grid-template-columns:1fr;max-width:400px">
    <section>
      <div class="login-box" id="box-wait" style="display:none">
        <h2>Aguarde…</h2>
        <p style="font-size:11px;color:#90949c">Validando o link do e-mail.</p>
      </div>

      <div class="login-box" id="box-new-password" style="display:none">
        <h2>Nova senha</h2>
        <div id="reset-error" class="error-msg" style="display:none"></div>
        <form id="form-new-password">
          <div class="form-group">
            <label for="new-password">Senha nova (mín. 6)</label>
            <input type="password" id="new-password" minlength="6" required>
          </div>
          <div class="form-group">
            <label for="new-password2">Repita a senha</label>
            <input type="password" id="new-password2" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-green">Salvar e entrar</button>
        </form>
      </div>

      <div class="login-box" id="box-invalid">
        <h2>Link inválido ou expirado</h2>
        <p style="font-size:11px;margin-bottom:10px">
          Peça um novo link em <a href="index.html">Esqueci minha senha</a>.
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/storage.js"></script>
  <script>
    (async function () {
      if (!isConfigured()) {
        window.location.href = "index.html";
        return;
      }

      const wait = document.getElementById("box-wait");
      const formBox = document.getElementById("box-new-password");
      const invalid = document.getElementById("box-invalid");
      const err = document.getElementById("reset-error");
      let canReset = false;

      wait.style.display = "block";
      invalid.style.display = "none";

      const sb = getSupabase();

      sb.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
          canReset = true;
          wait.style.display = "none";
          invalid.style.display = "none";
          formBox.style.display = "block";
        }
      });

      const { data } = await sb.auth.getSession();
      if (data?.session) {
        canReset = true;
        wait.style.display = "none";
        formBox.style.display = "block";
      } else {
        setTimeout(() => {
          if (!canReset) {
            wait.style.display = "none";
            invalid.style.display = "block";
          }
        }, 2500);
      }

      document.getElementById("form-new-password").addEventListener("submit", async (e) => {
        e.preventDefault();
        err.style.display = "none";

        const p1 = document.getElementById("new-password").value;
        const p2 = document.getElementById("new-password2").value;

        if (p1 !== p2) {
          err.textContent = "As senhas não coincidem.";
          err.style.display = "block";
          return;
        }

        try {
          await updatePassword(p1);
          window.location.href = "home.html";
        } catch (error) {
          err.textContent = error.message || "Não foi possível salvar.";
          err.style.display = "block";
        }
      });
    })();
  </script>
</body>
</html>
